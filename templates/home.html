{% extends "base.html" %}

{% block content %}

<h2>ゲーム</h2>

<div class="game-list">
    <button>Street Fighter 6</button>
</div>

<h2>キャラクター</h2>

<div class="character-list">

    {% for character in characters %}
        <div class="character-row">

            <a href="/character/{{ character.id }}" class="character-link">
                {{ character.name }}
            </a>

        </div>
    {% endfor %}

</div>

{% endblock %}
